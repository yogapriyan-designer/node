<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Attendance Intelligence</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d6ecfa;--card:#f7fbff;--tx:#10243a;--mu:#4a5f78;--bd:#bcdcf1;--ac:#0369a1;--ok:#15803d;--wa:#b45309;--da:#c81e1e;--ex:#0e7490}
:root[data-theme=dark]{--bg:#0d1020;--card:#171b30;--tx:#eef0f8;--mu:#a0a8c4;--bd:#2a2f4b;--ac:#8b85ff;--ok:#4ade80;--wa:#fbbf24;--da:#f87171;--ex:#22d3ee}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

button,select,input{font:inherit;color:var(--tx)}button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 12px}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}input[type=number]{width:80px}
main{max-width:1100px;margin:0 auto;padding:16px 14px 90px;position:relative;z-index:1}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 1px 3px #0001}.c h3{margin:0 0 8px;font-size:14px;color:var(--mu);font-weight:600}
.big{font-size:34px;font-weight:750;line-height:1.1}.mu{color:var(--mu);font-size:13px}h2{margin:18px 0 10px}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.Excellent{color:var(--ex)}.Safe{color:var(--ok)}.Watch{color:var(--wa)}.Danger,.Irrecoverable{color:var(--da)}.NoData{color:var(--mu)}
.alert{border:2px solid var(--da);border-radius:16px;padding:14px;margin:12px 0;background:var(--card)}.alert h3{color:var(--da);margin:0 0 6px;font-size:16px;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{color:var(--mu)}.tw{overflow-x:auto}
.bar{height:10px;background:var(--bd);border-radius:6px;position:relative;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--da)}.bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ok)}
.tt td{text-align:center;min-width:64px}.tt td small{display:block;color:var(--mu);font-size:10px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;border-radius:99px;padding:12px 18px;box-shadow:0 6px 20px #0004}
#chat{position:fixed;z-index:10;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--bd);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#chat.open{display:flex}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{padding:9px 12px;border-radius:12px;max-width:92%;background:var(--bg);white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m details{margin-top:6px;color:var(--mu);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.chips button{font-size:12px;padding:4px 9px;border-radius:99px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}@media(max-width:640px){th:nth-child(n+6),td:nth-child(n+6){display:none}.big{font-size:28px}}
#irid{position:fixed;inset:0;z-index:0;pointer-events:none}#irid canvas{display:block;width:100%;height:100%}#tun{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 14px;background:transparent}.brand{font-size:17px;margin-right:auto}
#hd{--base:#0c4a6e;--pill-bg:#fff;--pill-text:#0c4a6e;--hover-text:#fff}:root[data-theme=dark] #hd{--base:#232a4d;--pill-bg:#eef0f8;--pill-text:#10142b;--hover-text:#fff}
.pill-nav-container{position:relative;z-index:99}.pill-nav{--nav-h:42px;display:flex;align-items:center;gap:8px;width:max-content}
.pill-nav-items{height:var(--nav-h);background:var(--base);border-radius:9999px;display:flex;align-items:center}
.pill-logo{width:var(--nav-h);height:var(--nav-h);border-radius:50%;background:var(--base);display:inline-flex;align-items:center;justify-content:center;color:var(--pill-bg);font-size:20px;text-decoration:none}
.pill-list{list-style:none;display:flex;gap:3px;margin:0;padding:3px;height:100%}.pill-list>li{display:flex;height:100%}
.pill{display:inline-flex;align-items:center;justify-content:center;height:100%;padding:0 14px;background:var(--pill-bg);color:var(--pill-text);border:0;border-radius:9999px;font-weight:600;font-size:13px;line-height:0;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;position:relative;overflow:hidden}
.hover-circle{position:absolute;left:50%;bottom:0;border-radius:50%;background:var(--base);z-index:1;pointer-events:none;will-change:transform;transform:translateX(-50%) scale(0)}
.label-stack{position:relative;display:inline-block;line-height:1;z-index:2}.pill-label{position:relative;z-index:2;display:inline-block;line-height:1}.pill-label-hover{position:absolute;left:0;top:0;color:var(--hover-text);z-index:3;display:inline-block;opacity:0}
.pill.is-active .pill-label{text-decoration:underline;text-underline-offset:5px}
#th{width:42px;height:42px;padding:0;border:0;border-radius:50%;background:var(--base);color:var(--pill-bg);font-size:18px}
.mobile-only{display:none}.bare .pill-nav-items,.bare .mobile-menu-button{display:none!important}
.mobile-menu-button{width:42px;height:42px;border-radius:50%;background:var(--base);border:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.hamburger-line{width:16px;height:2px;background:var(--pill-bg);border-radius:1px;transition:transform .25s}
.mobile-menu-button.x .hamburger-line:nth-child(1){transform:translateY(3px) rotate(45deg)}.mobile-menu-button.x .hamburger-line:nth-child(2){transform:translateY(-3px) rotate(-45deg)}
.mobile-menu-popover{position:absolute;top:3.2em;left:0;right:0;min-width:200px;background:var(--base);border-radius:27px;box-shadow:0 8px 32px #0003;z-index:998;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}.mobile-menu-popover.open{opacity:1;visibility:visible}
.mobile-menu-list{list-style:none;margin:0;padding:3px;display:flex;flex-direction:column;gap:3px}
.mobile-menu-link{display:block;width:100%;text-align:left;padding:12px 16px;color:var(--pill-text);background:var(--pill-bg);border:0;border-radius:50px;font-weight:500}.mobile-menu-link.is-active{font-weight:750;text-decoration:underline}
.ch{display:inline-block}
@media(max-width:900px){.brand{display:none}}
@media(max-width:768px){.desktop-only{display:none}.mobile-menu-button{display:flex}.mobile-menu-popover{display:block}.pill-nav-container{flex:1}.pill-nav{width:100%;justify-content:space-between}}

#hl{height:34px;width:auto;display:block;flex:none;user-select:none;-webkit-user-drag:none}
:root[data-theme=dark] #hl,:root[data-theme=dark] #sp-logo{filter:invert(1)}
@media(max-width:480px){#hl{height:28px}}
html.pre #hl{opacity:0}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}#sp-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--card),var(--bg) 70%)}
#splash .ln{position:absolute;left:0;height:2px;width:60%;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:0;transform:translateX(-120%)}
#sp-wrap{position:relative;width:min(560px,80vw)}
#sp-wrap img{display:block;width:100%;height:auto;-webkit-user-drag:none}
#sp-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,var(--ac) 50%,transparent 65%) -150% 0/200% 100% no-repeat;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;mix-blend-mode:normal}
#sp-glow{position:absolute;left:50%;top:50%;width:70%;height:180%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--ac),transparent);opacity:0;filter:blur(30px);pointer-events:none}
@media(prefers-reduced-motion:reduce){#splash{display:none}html.pre #hl{opacity:1}}

/* ===== CONFIG ===== */
const CFG={min:75,target:90};
/* ===== CALCULATION ENGINE (single source of every formula) ===== */
const pct=(a,c)=>c?a*100/c:null;
const safeAbs=(a,c,F,t)=>{const m=Math.floor((100*(a+F)-t*(c+F))/100);return Math.max(0,Math.min(F,m))};
const needed=(a,c,t)=>t>=100?(a==c?0:Infinity):Math.max(0,Math.ceil((t*c-100*a)/(100-t)));
const maxPossible=(a,c,F)=>pct(a+F,c+F);
const recoverable=(a,c,F,t)=>100*(a+F)>=t*(c+F);
const proj=(a,c,fa,fm)=>pct(a+fa,c+fa+fm);
function status(a,c,F){if(!c)return"NoData";if(!recoverable(a,c,F,CFG.min)&&pct(a,c)<CFG.min)return"Irrecoverable";const p=pct(a,c);return p<CFG.min?"Danger":p<CFG.min+5?"Watch":p<CFG.target?"Safe":"Excellent"}
/* ===== TIMETABLE ENGINE ===== */
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const grid=sec=>T[sec].d.map(r=>r.split(" "));
const letters=sec=>[...new Set(grid(sec).flat().filter(x=>x!="-"))].sort();
const nm=(sec,l)=>{const e=T[sec].s[l];return e[2]||N[e[0]]||e[0]};
function daySlots(sec,date){const w=date.getDay()-1;if(w<0||w>4||S.hol.includes(ymd(date)))return[];return grid(sec)[w].map((l,i)=>l=="-"?null:{l,p:i+1}).filter(Boolean)}
function between(sec,from,to,ov){const o={};for(let d=new Date(from);d<=to;d=addD(d,1))daySlots(sec,d).forEach(x=>o[x.l]=(o[x.l]||0)+1);return o}
/* ===== STATE (single source of truth) ===== */
const def=()=>({sec:null,name:"",start:"2026-07-01",end:"2026-11-30",hol:["2026-10-02"],att:{},od:"attended",med:"absent",tab:"dash"});
let S=def();try{Object.assign(S,JSON.parse(localStorage.getItem("ai_state")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ai_state",JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const remCounts=()=>{const f=addD(today(),1),e=pd(S.end);return f>e?{}:between(S.sec,f,e)};
function rows(){const R=remCounts();return letters(S.sec).map(l=>{const[a,c]=S.att[l]||[0,0],F=R[l]||0,p=pct(a,c);return{l,name:nm(S.sec,l),fac:T[S.sec].s[l][1],a,c,F,p,st:status(a,c,F),safe:safeAbs(a,c,F,CFG.min),n75:needed(a,c,CFG.min),n90:needed(a,c,CFG.target),max:maxPossible(a,c,F)}})}
const tot=r=>{const a=r.reduce((s,x)=>s+x.a,0),c=r.reduce((s,x)=>s+x.c,0);return{a,c,p:pct(a,c)}};
const f1=x=>x==null?"–":x.toFixed(1)+"%";const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const badge=s=>`<span class="b ${s}">${s=="NoData"?"No data":s}</span>`;
/* ===== SCENARIOS (shared by simulator + chatbot) ===== */
function leave(from,to,type){const B=between(S.sec,from,to),pol=type=="od"?S.od:type=="med"?S.med:"absent",R=remCounts(),after=new Date(Math.max(+addD(to,1),+addD(today(),1))),Rest=between(S.sec,after,pd(S.end));
return rows().map(r=>{const k=B[r.l]||0;let a=r.a,c=r.c;if(pol=="attended"){a+=k;c+=k}else if(pol=="absent")c+=k;const F=Rest[r.l]||0,before=r.p,now=pct(a,c);return{...r,k,now,before,F,end_all:maxPossible(a,c,F),ok:pct(a,c)>=CFG.min,rec:recoverable(a,c,F,CFG.min),need:needed(a,c,CFG.min),pol}})}
/* ===== UI ===== */
const TABS=[["dash","Dashboard"],["att","Attendance"],["tt","Timetable"],["plan","Planner"],["sim","Simulator"],["set","Settings"]];

function welcome(){return`<div class="c" style="max-width:560px;margin:40px auto;text-align:center"><div class="big">Know your attendance.<br>Plan your semester.</div><h3 style="margin:14px 0 0">Log in to continue</h3><p class="mu">Track, predict and protect your attendance with intelligent planning.</p><div class="row" style="justify-content:center"><input id="nm" placeholder="Your name" aria-label="Your name"></div><div class="row" style="justify-content:center"><select id="sc" aria-label="Select your section">${Object.keys(T).map(k=>`<option>${k}</option>`).join("")}</select></div><button class="pri" id="go">Log in</button><p class="mu">Timetables for 10 SRM Tiruchirappalli sections are built in.</p></div>`}
const donut=(p,st)=>{const r=52,c=2*Math.PI*r,d=(p==null?0:Math.min(p,100))/100*c;return`<svg viewBox="0 0 130 130" width="130" role="img" aria-label="Overall attendance ${f1(p)}"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="currentColor" class="${st}" stroke-width="12" stroke-dasharray="${d} ${c}" transform="rotate(-90 65 65)" stroke-linecap="round"/><text x="65" y="71" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${p==null?"–":p.toFixed(1)}</text></svg>`};
function reco(R){const o=[];R.filter(r=>r.st=="Irrecoverable").forEach(r=>o.push(`${r.name} cannot be recovered above ${CFG.min}% – speak to your faculty/HOD about condonation.`));R.filter(r=>r.st=="Danger").forEach(r=>o.push(`Attend your next ${r.n75} ${r.name} classes to move back above ${CFG.min}%.`));R.filter(r=>r.st=="Watch").forEach(r=>o.push(`${r.name} is close to ${CFG.min}% – you can safely miss ${r.safe} more.`));R.filter(r=>r.st=="Excellent"&&r.safe>0).slice(0,2).forEach(r=>o.push(`You can safely miss ${r.safe} ${r.name} classes.`));return o.length?o:["Enter your attendance to get personalised advice."]}
function dash(){const R=rows(),t=tot(R),ts=t.c?(t.p<CFG.min?"Danger":t.p<CFG.min+5?"Watch":t.p<CFG.target?"Safe":"Excellent"):"NoData",h=new Date().getHours(),g=h<12?"morning":h<17?"afternoon":"evening",risk=R.filter(r=>["Danger","Irrecoverable","Watch"].includes(r.st)),remT=R.reduce((s,r)=>s+r.F,0);
const irr=R.filter(r=>r.st=="Irrecoverable").map(r=>`<div class="alert" role="alert"><h3>⚠ IRREVERSIBLE DETENTION – ${esc(r.name)}</h3><p>Your attendance in ${esc(r.name)} is too low to recover above ${CFG.min}% even if you attend every remaining class.</p><div class="g"><div><span class="mu">Current</span><div class="big" style="font-size:22px">${f1(r.p)}</div></div><div><span class="mu">Remaining classes</span><div class="big" style="font-size:22px">${r.F}</div></div><div><span class="mu">Best possible final</span><div class="big" style="font-size:22px">${f1(r.max)}</div></div><div><span class="mu">Required</span><div class="big" style="font-size:22px">${CFG.min}%</div></div><div><span class="mu">Shortfall</span><div class="big" style="font-size:22px">${(CFG.min-r.max).toFixed(1)} pts</div></div></div><p><b>Status: cannot recover.</b></p></div>`).join("");
const d=addD(today(),0),nx=[0,1].map(i=>{const x=addD(d,i);return`<b>${DAYS[x.getDay()-1]||x.toDateString().slice(0,3)} ${x.getDate()}</b><br>`+(daySlots(S.sec,x).map(s=>`<span class="mu">${TM[(T[S.sec].tm?TM1:TM)[s.p-1]?s.p-1:0][0]}</span> ${esc(nm(S.sec,s.l))}`).join("<br>")||'<span class="mu">No classes</span>')}).join("<hr>");
return`<h2 style="margin-top:0">Good ${g}, ${esc(S.name||"Student")}</h2><p class="mu" style="margin-top:-6px">Here's your attendance health · ${S.sec} · ${T[S.sec].v}</p>${t.c?"":`<div class="c">Your attendance dashboard is waiting for your data. <button class="pri" data-t="att">Add Attendance</button></div>`}${irr}
<div class="g"><div class="c" style="display:flex;gap:14px;align-items:center;grid-column:span 2"><div class="${ts}">${donut(t.p,ts)}</div><div><h3>Overall attendance</h3><div class="big">${f1(t.p)}</div>${badge(ts)}<div class="mu">Minimum ${CFG.min}% · Target ${CFG.target}%</div></div></div><div class="c"><h3>Subjects at risk</h3><div class="big">${risk.length}</div></div><div class="c"><h3>Classes remaining</h3><div class="big">${remT}</div><div class="mu">until ${S.end}</div></div><div class="c"><h3>Classes to reach ${CFG.target}% overall</h3><div class="big">${t.c?(needed(t.a,t.c,CFG.target)>remT?"Not reachable":needed(t.a,t.c,CFG.target)):"–"}</div></div></div>
<h2>Smart recommendations</h2><div class="c">${reco(R).map(x=>`<p style="margin:4px 0">• ${esc(x)}</p>`).join("")}</div>
<h2>Current vs target</h2><div class="c">${R.map(r=>`<div><div class="row" style="justify-content:space-between;margin:0"><span>${esc(r.name)}</span><span class="${r.st}"><b>${f1(r.p)}</b></span></div><div class="bar"><i style="width:${Math.min(r.p||0,100)}%"></i><u style="left:${CFG.min}%"></u><s style="left:${CFG.target}%"></s></div></div>`).join("")}<div class="mu">Red line = minimum ${CFG.min}% · Green line = target ${CFG.target}%</div></div>
<h2>Subjects</h2><div class="c tw"><table><thead><tr><th>Subject</th><th>Attendance</th><th>Status</th><th>Held</th><th>Remaining</th><th>Safe absences</th><th>Need for ${CFG.min}%</th><th>Need for ${CFG.target}%</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.name)}</td><td>${f1(r.p)}</td><td>${badge(r.st)}</td><td>${r.c}</td><td>${r.F}</td><td>${r.safe}</td><td>${r.n75}</td><td>${r.n90==Infinity||r.n90>r.F?"Not reachable":r.n90}</td></tr>`).join("")}</tbody></table></div>
<h2>Today &amp; tomorrow</h2><div class="c">${nx}</div>`}
function att(){const R=rows();return`<h2 style="margin-top:0">Attendance entry</h2><p class="mu">Enter classes attended and conducted so far (exact counts give exact results).</p><div class="c tw"><table><thead><tr><th>Subject</th><th>Attended</th><th>Conducted</th><th>Attendance</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.name)}<div class="mu">${esc(r.fac)}</div></td><td><input type="number" min="0" data-a="${r.l}" value="${r.a}" aria-label="${esc(r.name)} attended"></td><td><input type="number" min="0" data-c="${r.l}" value="${r.c}" aria-label="${esc(r.name)} conducted"></td><td>${f1(r.p)}</td></tr>`).join("")}</tbody></table></div><p class="mu">Only have a percentage? Enter conducted classes, then attended ≈ % × conducted ÷ 100.</p><div id="attmsg" class="mu" role="status"></div>`}

const root=document.documentElement,hl=document.getElementById("hl");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(reduce||!window.gsap){return}
root.classList.add("pre");
const sp=document.createElement("div");sp.id="splash";sp.setAttribute("aria-hidden","true");
sp.innerHTML='<div id="sp-bg"></div><i class="ln" style="top:34%"></i><i class="ln" style="top:50%;height:3px"></i><i class="ln" style="top:66%"></i><div id="sp-wrap"><div id="sp-glow"></div><img id="sp-logo" alt="" src="data:image/png;base64,'+FULL+'"><div id="sp-shine"></div></div>';

const wrap=sp.querySelector("#sp-wrap"),logo=sp.querySelector("#sp-logo"),shine=sp.querySelector("#sp-shine"),glow=sp.querySelector("#sp-glow"),lns=sp.querySelectorAll(".ln");
sp.style.setProperty("--m","url(data:image/png;base64,"+FULL+")");
let done=false;
function finish(){if(done)return;done=true;tl.kill();root.classList.remove("pre");gsap.set(hl,{opacity:1,clearProps:"transform"});sp.remove();document.body.style.overflow=""}
const tl=gsap.timeline({defaults:{ease:"power3.out"}});

gsap.set(logo,{clipPath:"inset(0 100% 0 0)",filter:"blur(12px)"});
tl.to(lns,{opacity:1,x:"180%",duration:.9,stagger:.1,ease:"power2.inOut"},0)
 .to(wrap,{opacity:1,scale:1,duration:.5},.05)
 .to(logo,{clipPath:"inset(0 0% 0 0)",duration:.6,ease:"power2.inOut"},.08)
 .to(logo,{filter:"blur(0px)",duration:.5},.15)
 .to(glow,{opacity:.35,duration:.4,yoyo:true,repeat:1},.25)
 .to(shine,{backgroundPosition:"250% 0",duration:.7,ease:"power1.inOut"},.55)
 .add(()=>{
   const r=hl.getBoundingClientRect(),c=wrap.getBoundingClientRect();
   const k=r.width/(c.width*0.2515),cx=r.left+c.width*k/2,cy=r.top+r.height/2;
   gsap.to(wrap,{x:"+="+(cx-(c.left+c.width/2)),y:"+="+(cy-(c.top+c.height/2)),scale:gsap.getProperty(wrap,"scale")*k,duration:.6,ease:"power3.inOut"});
   gsap.to(sp.querySelector("#sp-bg"),{opacity:0,duration:.6,ease:"power2.in"});
   gsap.to(lns,{opacity:0,duration:.25});

   gsap.to(wrap,{opacity:0,duration:.2,delay:.55});
 },1.3)
 .add(finish,2.0);
